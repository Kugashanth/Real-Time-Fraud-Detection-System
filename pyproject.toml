[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-fraud-detection"
version = "1.0.0"
description = "End-to-End Real-Time Fraud Detection System with SMOTE-ENN, Optuna, ONNX FastAPI & Drift Monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pandera>=0.18.0",
    "scikit-learn>=1.5.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "mlflow>=2.12.0",
    "mapie>=0.8.0",
    "shap>=0.45.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.16.0",
    "onnxruntime>=1.17.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "evidently>=0.4.20",
    "nannyml>=0.10.0",
    "joblib>=1.4.0",
    "pyyaml>=6.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
